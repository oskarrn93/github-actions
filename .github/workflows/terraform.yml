name: Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Terraform root module
        type: string
        default: .
      version:
        description: Terraform version; defaults to the root module's .terraform-version, else latest
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve Terraform version
        id: tf
        run: |
          version="${VERSION}"
          if [ -z "$version" ] && [ -f .terraform-version ]; then
            version="$(cat .terraform-version)"
          fi
          echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
