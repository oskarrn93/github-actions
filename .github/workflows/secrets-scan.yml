name: Secrets scan

on:
  workflow_call:
    inputs:
      sops-files:
        description: Git pathspec for sops-encrypted files that must carry sops metadata
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read # gitleaks lists the PR's commits; callers must grant it too

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sops-encrypted:
    if: inputs.sops-files != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          status=0
          set -f # keep pathspec globs for git, not the shell
          # shellcheck disable=SC2086 # unquoted so multiple pathspecs split into separate args
          for f in $(git ls-files -- ${SOPS_FILES}); do
            # sops writes `sops:` (yaml) or `"sops":` (json) or ENC[ values (env/ini/binary); `.sops` files may also be raw age
            if ! grep -Eq '^"?sops"?:|^sops_|ENC\[AES256_GCM|^age-encryption\.org/' "$f"; then
              echo "::error file=$f::not sops-encrypted"
              status=1
            fi
          done
          exit "$status"
        env:
          SOPS_FILES: ${{ inputs.sops-files }}
