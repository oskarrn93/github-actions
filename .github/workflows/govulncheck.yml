name: Govulncheck

on:
  workflow_call:
    inputs:
      packages:
        description: Package patterns to scan
        type: string
        default: ./...
      version:
        description: govulncheck version
        type: string
        default: v1.9.0

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: |
          # shellcheck disable=SC2086 # unquoted so multiple patterns split into separate args
          go run "golang.org/x/vuln/cmd/govulncheck@${VERSION}" ${PACKAGES}
        env:
          VERSION: ${{ inputs.version }}
          PACKAGES: ${{ inputs.packages }}
